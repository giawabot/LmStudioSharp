name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LmStudioSharp.sln

      - name: Build (Release)
        run: dotnet build LmStudioSharp.sln --configuration Release --no-restore

      - name: Prepare release bundle
        shell: bash
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          BUNDLE_DIR="artifacts/LmStudioSharp-${TAG_NAME}"
          mkdir -p "${BUNDLE_DIR}"
          cp src/LmStudioSharp/bin/Release/net8.0/LmStudioSharp.dll "${BUNDLE_DIR}/"
          if [ -f src/LmStudioSharp/bin/Release/net8.0/LmStudioSharp.pdb ]; then
            cp src/LmStudioSharp/bin/Release/net8.0/LmStudioSharp.pdb "${BUNDLE_DIR}/"
          fi
          if [ -f src/LmStudioSharp/bin/Release/net8.0/LmStudioSharp.xml ]; then
            cp src/LmStudioSharp/bin/Release/net8.0/LmStudioSharp.xml "${BUNDLE_DIR}/"
          fi
          cd artifacts
          zip -r "LmStudioSharp-${TAG_NAME}.zip" "LmStudioSharp-${TAG_NAME}"

      - name: Attach artifact to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
